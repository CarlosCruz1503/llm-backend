[project]
name = "django-docker"
version = "0.1.0"
description = "Django REST API: provider-agnostic LLM abstraction, async RAG ingestion, and token-budgeted chat"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "celery==5.3.6",
    "chonkie>=1.7.0",
    "django>=6.0.7",
    "django-crum>=0.7.9",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "drf-spectacular-sidecar>=2026.7.1",
    "fastembed>=0.8.0",
    "flower==2.0.1",
    "google-genai>=2.14.0",
    "gunicorn>=26.0.0",
    "openrouter>=1.1.12",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.12.5",
    "redis==5.0.1",
    "tiktoken>=0.13.0",
    "tokenizers>=0.20.0",
    "transformers>=4.45.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.6",
]

[tool.ruff]
target-version = "py313"
extend-exclude = ["migrations"]

[tool.ruff.lint]
# Scoped to real mistakes (undefined names, unused imports, syntax errors)
# rather than style/formatting — this is a lint gate, not a reformatting
# pass over code that was never written to one style guide.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Every app's __init__.py re-exports its submodules on purpose (`from
# chat.models import Conversation` instead of `chat.models.conversation`) —
# that's the intended shape, not a mistake.
"**/__init__.py" = ["F401"]
