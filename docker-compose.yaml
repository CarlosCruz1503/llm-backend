services:
  web:
    container_name: core_ai_agent
    build:
      context: .
      # Build the development stage from the multi-stage Dockerfile.
      target: develop
    ports:
      - "8000:8000"
    env_file: .env
    # environment:
    #   # Enable Django's verbose debug error pages (the dev server always auto-reloads).
    #   - DEBUG=1
    #   # Database connection settings passed to Django via environment variables.
    #   - POSTGRES_DB=myapp
    #   - POSTGRES_USER=postgres
    #   - POSTGRES_PASSWORD=password
    #   - POSTGRES_HOST=db
    #   - POSTGRES_PORT=5432
    # Wait for the database to pass its healthcheck before starting the web service.
    depends_on:
      - db
      - redis
    volumes:
      # Bind mount the repo so changes made on either side (host editor or
      # `docker exec`, e.g. startapp/makemigrations) show up on both.
      - .:/app
      # Anonymous volume shadows the bind mount for just this path, so the
      # image's own .venv (built for the container's platform) isn't hidden
      # by the host's (which may not exist, or target a different platform).
      - /app/.venv
    # develop:
    #   watch:
    #     # Rebuild the image when dependencies change.
    #     - action: rebuild
    #       path: pyproject.toml
    #     - action: rebuild
    #       path: uv.lock
  db:
    image: pgvector/pgvector:pg16
    restart: always
    volumes:
      # Persist database data across container restarts.
      - db-data:/var/lib/postgresql
    # Read from the same .env file everything else uses (compose
    # auto-substitutes ${VAR} below from it), so changing POSTGRES_* in
    # .env actually changes the database's own credentials too — previously
    # these were hardcoded here and silently ignored .env.
    env_file: .env
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    # Expose the port only to other services on the Compose network,
    # not to the host machine.
    expose:
      - 5432
    # Only report healthy once PostgreSQL is ready to accept connections,
    # so the web service doesn't start before the database is available.
    healthcheck:
      test: ["CMD", "pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine

  celery_worker:
    build:
      context: .
      target: develop
    image: django_celery_celery_worker
    command: /start-celeryworker
    volumes:
      - .:/app
      # See web's volumes above: without this, the bind mount hides the
      # image's own .venv (built for python:3.10-bullseye) behind the host's
      # (built for a different Python), and imports like psycopg fail.
      - /app/.venv
    environment:
      # Unlike `web` (started via manage.py, which defaults this itself), the
      # bare `celery` CLI needs DJANGO_SETTINGS_MODULE set explicitly before
      # it can load django.conf.settings.
      - DJANGO_SETTINGS_MODULE=myapp.settings
    env_file:
      - .env
    depends_on:
      - redis
      - db

  celery_beat:
    build:
      context: .
      target: develop
    image: django_celery_celery_beat
    command: /start-celerybeat
    volumes:
      - .:/app
      # See web's volumes above: without this, the bind mount hides the
      # image's own .venv (built for python:3.10-bullseye) behind the host's
      # (built for a different Python), and imports like psycopg fail.
      - /app/.venv
    environment:
      # Unlike `web` (started via manage.py, which defaults this itself), the
      # bare `celery` CLI needs DJANGO_SETTINGS_MODULE set explicitly before
      # it can load django.conf.settings.
      - DJANGO_SETTINGS_MODULE=myapp.settings
    env_file:
      - .env
    depends_on:
      - redis
      - db

  flower:
    build:
      context: .
      target: develop
    image: django_celery_celery_flower
    command: /start-flower
    volumes:
      - .:/app
      # See web's volumes above: without this, the bind mount hides the
      # image's own .venv (built for python:3.10-bullseye) behind the host's
      # (built for a different Python), and imports like psycopg fail.
      - /app/.venv
    environment:
      # Unlike `web` (started via manage.py, which defaults this itself), the
      # bare `celery` CLI needs DJANGO_SETTINGS_MODULE set explicitly before
      # it can load django.conf.settings.
      - DJANGO_SETTINGS_MODULE=myapp.settings
    env_file:
      - .env
    ports:
      - 5557:5555
    depends_on:
      - redis
      - db

    
volumes:
  db-data: